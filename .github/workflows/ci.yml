name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  checks:
    name: Tests, types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests (game engine, critter art, app)
        run: npm test
      - name: Typecheck the workspaces
        run: npm run typecheck
      - name: Typecheck the Edge Function modules
        run: npm run typecheck:functions
      - name: Typecheck the end-to-end tests
        run: npm run typecheck:e2e
      - name: Lint the app
        run: npm run lint

  database:
    name: Database, API and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The CLI version comes from package-lock.json, the same one used locally.
      - uses: supabase/setup-cli@v3
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,mailpit
      - name: Serve the Edge Functions
        run: |
          echo "CRON_SECRET=local-cron-secret" > supabase/functions/.env
          nohup supabase functions serve > functions.log 2>&1 &
      - name: Run the database tests
        run: supabase test db
      - name: Run the smoke tests against the local API
        run: |
          eval "$(supabase status -o env | grep -E '^(PUBLISHABLE_KEY|SECRET_KEY)=')"
          export SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY"
          for name in packs critter feeds day-close push widgets delete-account; do
            echo "::group::smoke:$name"
            npm run "smoke:$name"
            echo "::endgroup::"
          done
      - name: Build the web app against the local API
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=')"
          echo "EXPO_PUBLIC_SUPABASE_URL=$API_URL" > apps/mobile/.env
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> apps/mobile/.env
          npm run e2e:build
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        run: |
          eval "$(supabase status -o env | grep -E '^(PUBLISHABLE_KEY|SECRET_KEY)=')"
          export SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" SUPABASE_SECRET_KEY="$SECRET_KEY"
          npm run e2e
      - name: Keep the traces of failed end-to-end tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: e2e/test-results
          if-no-files-found: ignore
      - name: Edge Function logs
        if: failure()
        run: cat functions.log
