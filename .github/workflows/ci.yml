name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  checks:
    name: Tests, types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Game engine and critter art tests
        run: npm test
      - name: Typecheck the workspaces
        run: npm run typecheck
      - name: Typecheck the Edge Function modules
        run: npm run typecheck:functions
      - name: Lint the app
        run: npm run lint

  database:
    name: Database tests (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,logflare,vector,supavisor,edge-runtime,mailpit
      - name: Run the database tests
        run: supabase test db
